services:
  my-jenkins:
    image: my-jenkins
    container_name: my-jenkins
    restart: on-failure
    environment:
      - JAVA_OPTS=-Dhudson.model.DirectoryBrowserSupport.CSP="default-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';"
    volumes:
      - jenkins-data:/var/jenkins_home
      # host's docker daemon, not a separate dind sidecar: agent { docker {...} } bind-mounts
      # the Jenkins workspace into sibling containers, which only resolves correctly when
      # the same daemon owns both this container's volume and the containers it spawns.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9000:8080"
      - "50000:50000"

volumes:
  jenkins-data:
